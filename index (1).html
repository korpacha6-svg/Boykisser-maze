<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cat Maze</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Unbounded:wght@700&display=swap">
<style>
:root{--bg:#f5f0ff;--card:#fff;--ink:#2a1d44;--mut:#6f6590;--pink:#ff4fa3;--sky:#3fb6ee;--line:#dcd0f5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15101f;--card:#231a36;--ink:#f4eeff;--mut:#a99dc9;--line:#3b2d58;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15101f;--card:#231a36;--ink:#f4eeff;--mut:#a99dc9;--line:#3b2d58;color-scheme:dark}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:600;-webkit-tap-highlight-color:transparent}
h1,h2,.num{font-family:Unbounded,Nunito,system-ui,sans-serif;font-weight:700;margin:0}
#app{max-width:900px;margin:0 auto;padding:12px 14px}
.scr{display:none}.scr.on{display:block}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:18px;background:var(--pink);color:#fff;font:800 18px Nunito,system-ui,sans-serif;margin:10px 0;cursor:pointer}
.btn.sec{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn:focus-visible,.sq:focus-visible,.pick:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sq{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;width:46px;height:46px;font-size:20px;cursor:pointer}
.hero{text-align:center;padding:18px 0 6px}
.hero img{width:132px;height:auto;display:block;margin:0 auto 10px}
.hero h1{font-size:26px;line-height:1.15}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:99px;padding:6px 14px;margin-top:12px;font-weight:800}
.chip svg{width:22px;height:auto}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin:10px 0}
.med{display:flex;gap:14px;align-items:center}
.med .gw{width:78px;flex:none}.mi{flex:1}.mu{color:var(--mut);font-size:14px;margin-top:4px}
.bar{height:8px;border-radius:9px;background:var(--line);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--sky);border-radius:9px}
.gh{display:block;width:100%;height:auto}
#hud{flex:1;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:20px}
#hud svg{width:28px;height:auto}
canvas{display:block;margin:0 auto;border-radius:16px;touch-action:none;box-shadow:0 0 0 3px var(--line)}
#pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:8px;justify-content:center;margin-top:14px}
#pad button{border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:22px;touch-action:none}
.ov{position:fixed;inset:0;background:rgba(20,10,35,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.ov.on{display:flex}
.box{background:var(--card);border-radius:26px;padding:22px;max-width:360px;width:100%;text-align:center}
.box img{width:84px;height:auto}.box .num{font-size:34px;color:var(--pink);margin:8px 0}
.avatar{position:relative;width:120px;margin:6px auto 12px}.avatar img{width:100%;height:auto;display:block}
.avatar .badge{position:absolute;right:-26px;bottom:-4px;width:54px}
input{width:100%;box-sizing:border-box;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:12px;font:800 18px Nunito,system-ui,sans-serif;text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:12px 0}.stats b{display:block;font-size:20px}.stats span{color:var(--mut);font-size:13px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px}
.pick{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:8px 4px;font:700 12px Nunito,system-ui,sans-serif;cursor:pointer}
.pick.sel{border-color:var(--pink);background:var(--card);box-shadow:0 0 0 2px var(--pink)}
.pick svg{width:100%;height:auto;display:block;margin-bottom:4px}
.none{margin-top:8px}
#menu.on{display:flex;align-items:center;justify-content:center;gap:24px;min-height:calc(100vh - 40px)}
#menu .hero{flex:1;padding:0}#menu .btns{flex:1;max-width:340px}
#game.on{display:grid;grid-template-columns:auto 208px;grid-template-areas:"cv top" "cv pad";grid-template-rows:auto 1fr;column-gap:16px;justify-content:center;align-items:start}
#game canvas{grid-area:cv;margin:0;align-self:center}#game .top{grid-area:top;margin:0}#game #pad{grid-area:pad;align-self:center;margin-top:0}
#mlist{display:grid;grid-template-columns:1fr 1fr;gap:10px}#mlist .card{margin:0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}.cols .card{margin:0}
.avatar{width:90px}
.box{max-height:92vh;overflow:auto;padding:16px}.box img{width:56px}.box .num{font-size:28px;margin:4px 0}.box .btn{padding:10px;margin:6px 0}
#rot{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--bg);text-align:center;padding:24px}
#rot .ic{font-size:56px;display:inline-block;transform:rotate(90deg)}
@media (orientation:portrait){#rot{display:flex}}
.tabs{display:flex;gap:6px;margin-left:auto}.tab{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 16px;font:800 15px Nunito,system-ui,sans-serif;cursor:pointer}.tab.on{background:var(--pink);border-color:var(--pink);color:#fff}.tab:focus-visible{outline:3px solid var(--sky);outline-offset:2px}.srow{margin-top:10px}.srow b{font-size:14px}.srow .picks{margin-top:6px}#ns{margin-top:10px}
.gh.el{overflow:visible;filter:drop-shadow(0 0 4px var(--au)) drop-shadow(0 0 9px var(--au));animation:aura 2.4s ease-in-out infinite alternate}
@keyframes aura{to{filter:drop-shadow(0 0 7px var(--au)) drop-shadow(0 0 18px var(--au))}}
.pmed{display:flex;justify-content:center;gap:12px;min-height:46px;margin-bottom:12px}.pmed svg{width:42px;height:auto;overflow:visible}
#mmedal,#gmedal{display:inline-flex;gap:4px;align-items:center}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--pink)}
.pick img{width:100%;height:auto;display:block;margin-bottom:4px}
/* one screen, no page scroll */
html,body{height:100%;height:100dvh;overflow:hidden}
#app{max-width:none;height:100%;display:flex;flex-direction:column;padding:8px 14px}
.scr.on{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.top{margin-bottom:6px}.top .sq{width:40px;height:40px}
#menu.on{min-height:0}
.hero img{width:auto;height:min(38vh,130px);margin:0 auto 6px}.hero h1{font-size:22px}.chip{margin-top:8px}
.btn{padding:11px;margin:7px 0;font-size:17px}
#game.on{height:100%;min-height:0}
#medals>.card{padding:8px;text-align:center;margin:0 0 8px}
#mlist{grid-template-columns:repeat(5,1fr);gap:8px;align-content:start}
.med{display:block;text-align:center;padding:8px 6px}.med .gw{width:44px;margin:0 auto 4px}.med b{font-size:13px}.med .mu{font-size:11px;margin-top:2px}.med .bar{margin-top:5px;height:6px}
#profile .cols{flex:1;min-height:0;align-items:stretch}
.cols .card{min-height:0;overflow:auto;padding:10px}
.avatar{width:auto;margin:0 auto 6px}.avatar img{width:auto;height:min(22vh,84px);margin:0 auto}
.pmed{min-height:38px;margin-bottom:6px}.pmed svg{width:36px}
input{padding:8px;font-size:16px}
.stats{margin:8px 0 0}.stats b{font-size:17px}
.picks{grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}.pick{padding:5px 2px;font-size:11px}
.btn.none{padding:8px;margin:6px 0 0;font-size:15px}
#tabm>.card:last-child{display:flex;flex-direction:column}#coll{flex:1;min-height:0;overflow:auto}
.srow{margin-top:6px}#ns .btn{padding:8px;margin:0 0 4px;font-size:15px}
.box{padding:12px}.box img{width:44px}.box h2{font-size:18px}
/* layout v2: nothing gets cut off */
.scr.on{overflow:auto}
#menu.on{align-items:stretch;justify-content:center;gap:20px}
#menu .hero,#menu .btns{margin:auto 0}#menu .hero{flex:1}
.hero img{height:min(30vh,110px)}.hero h1{font-size:clamp(18px,6vh,22px)}
.btn{padding:clamp(7px,2.2vh,12px);margin:clamp(4px,1.4vh,8px) 0;font-size:clamp(14px,4vh,17px)}
#tabp{grid-template-columns:1.7fr 1fr}
#tabp>.card:first-child{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center}
#tabp .avatar{grid-column:1;grid-row:1;margin:0}#tabp .pmed{grid-column:1;grid-row:2;margin:0}#tabp #nm{grid-column:2;grid-row:1}#tabp .stats{grid-column:2;grid-row:2;margin:6px 0 0}
#car b{font-size:15px}
#tabm>.card:first-child{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
#tabm>.card:first-child b{order:1}#tabm #nomed{order:2;margin:0 0 0 auto;width:auto;display:inline-block;padding:4px 12px;font-size:13px}
#tabm .picks{order:3;width:100%;margin-top:0!important;grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
.pick{font-size:10px}
#tabm>.card:last-child{overflow:hidden}
.med .gw{width:36px}.med .mi>.mu:first-of-type{display:none}
#mlist{gap:6px}
#medals>.card{padding:4px 8px;margin-bottom:6px}
.box .btn{padding:8px;margin:5px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><div id="app">

<section class="scr on" id="menu">
  <div class="hero"><img class="cat" alt="Cat"><h1>Cat Maze</h1>
  <div class="chip"><span id="mmedal"></span><span id="mname"></span> · <span id="mpts"></span> coins</div></div>
  <div class="btns"><button class="btn" data-go="game">Play</button>
  <button class="btn sec" data-go="medals">Medals</button>
  <button class="btn sec" data-go="profile">Profile</button></div>
</section>

<section class="scr" id="game">
  <div class="top"><button class="sq" data-go="menu" aria-label="Menu">←</button>
  <div id="hud"><span>Points: <span id="got">0</span>/25</span><span id="gmedal"></span></div></div>
  <canvas id="cv"></canvas>
  <div id="pad"><span></span><button data-d="u" aria-label="Up">▲</button><span></span><button data-d="l" aria-label="Left">◀</button><button data-d="d" aria-label="Down">▼</button><button data-d="r" aria-label="Right">▶</button></div>
</section>

<section class="scr" id="medals">
  <div class="top"><button class="sq" data-go="menu" aria-label="Menu">←</button><h2 style="font-size:20px">Medals</h2></div>
  <div class="card" style="text-align:center">Season <b id="sno"></b> · <b id="tpts"></b> boykisser coins</div>
  <div id="mlist"></div>
</section>

<section class="scr" id="profile">
  <div class="top"><button class="sq" data-go="menu" aria-label="Menu">←</button><h2 style="font-size:20px">Profile</h2><div class="tabs"><button class="tab on" data-tab="p">Profile</button><button class="tab" data-tab="m">Medals</button><button class="tab" data-tab="a">Admin</button></div></div>
  <div class="cols" id="tabp">
  <div class="card">
    <div class="avatar"><img class="cat" alt="Cat"></div><div class="pmed" id="pbadge"></div>
    <input id="nm" maxlength="16" aria-label="Player name" placeholder="Your name">
    <div class="stats"><div><b id="sp"></b><span>season coins</span></div><div><b id="sw"></b><span>wins</span></div><div><b id="sb"></b><span>best win</span></div></div>
  </div>
  <div class="card"><b>Career</b><div class="stats" id="car"></div></div></div>
<div class="cols" id="tabm" style="display:none"><div class="card"><b>Pick up to 3 medals</b><div class="picks" id="picks" style="margin-top:10px"></div>
  <button class="btn sec none" id="nomed">Clear medals</button></div><div class="card"><b>Collection</b><div id="coll"></div><div id="ns"></div></div></div>
<div class="cols" id="taba" style="display:none"></div>
</section>
</div>

<div id="rot"><div class="ic">📱</div><h2 style="font-size:20px">Rotate your device</h2><div class="mu">Cat Maze plays in landscape only.</div></div>
<div class="ov" id="win"><div class="box"><img class="cat" alt="Cat">
  <h2 style="font-size:20px">All 25 points collected!</h2>
  <div class="num" id="rew"></div><div class="mu">boykisser coins for the win</div>
  <div class="mu" id="wtot"></div><div id="wnew" style="margin-top:10px;font-weight:800"></div>
  <button class="btn" id="again">Play again</button><button class="btn sec" data-go="menu">Menu</button></div></div>

 {id:"ruby",name:"Ruby",need:55000,c1:"#ff8a8a",c2:"#b8102c"},

const S={name:"Cat",pts:0,total:0,wins:0,best:0,medal:null,medals:[],skin:"",minR:350,season:1,hist:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem("catmaze")||"{}"))}catch(e){}
if(S.name==="Кот")S.name="Cat";
if(!S.total&&S.pts)S.total=S.pts;if(S.medal&&!String(S.medal).includes(":"))S.medal="1:"+S.medal;
if(S.medal){S.medals=[S.medal];S.medal=null}if(!Array.isArray(S.medals))S.medals=[];
const save=()=>{try{localStorage.setItem("catmaze",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id),fmt=n=>n.toLocaleString("en-US");
const med=id=>MEDALS.find(m=>m.id===id),SEASONS=12,medalsFor=s=>MEDALS.filter(m=>!(m.id==="ruby"&&s<3)&&!(m.el&&s<11)),earnedIn=s=>s===S.season?medalsFor(s).filter(m=>S.pts>=m.need).map(m=>m.id):(S.hist[s]||[]),seasonDone=()=>medalsFor(S.season).every(m=>S.pts>=m.need);let arm=false;
const doneCount=()=>S.season-1+(S.season>=SEASONS&&seasonDone()?1:0),adminOK=()=>doneCount()>=6,rollR=()=>{const mn=S.season>=11?Math.min(1500,Math.max(350,S.minR)):350,mx=Math.max(1000,mn);return mn+Math.floor(Math.random()*(mx-mn+1))};

let gid=0;
function ghost(m,locked){const id="g"+gid++;
 const spark=m.id==="diamond"||m.id==="eldiamond"?'<path d="M18 38l3 7 7 3-7 3-3 7-3-7-7-3 7-3zM82 56l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#fff"/>':"";
 return `<svg viewBox="0 0 100 124" class="gh${locked?" lock":""}${m.el?" el":""}"${m.el?` style="--au:${m.au}"`:""}><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${m.c1}"/><stop offset="1" stop-color="${m.c2}"/></linearGradient></defs>
 <polygon points="30,0 46,0 56,30 40,30" fill="#e8476a"/><polygon points="70,0 54,0 44,30 60,30" fill="#b72f4f"/>
 <g transform="translate(0,22)"><path d="M20 90V45C20 22 35 8 50 8C65 8 80 22 80 45V90L71 82L62 92L50 82L38 92L29 82Z" fill="url(#${id})" stroke="${m.c2}" stroke-width="3" stroke-linejoin="round"/>
 <ellipse cx="36" cy="30" rx="8" ry="12" fill="#fff" opacity=".4" transform="rotate(20 36 30)"/>
 <ellipse cx="40" cy="48" rx="5" ry="7" fill="#2a1d44"/><ellipse cx="60" cy="48" rx="5" ry="7" fill="#2a1d44"/><ellipse cx="50" cy="63" rx="4" ry="5" fill="#2a1d44"/>${spark}${m.el?'<path d="M50 22l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" fill="#fff" opacity=".95"/>':""}</g></svg>`}

function show(id){arm=false;document.querySelectorAll(".scr").forEach(s=>s.classList.toggle("on",s.id===id));$("win").classList.remove("on");
 ({menu:rMenu,game:startGame,medals:rMedals,profile:rProfile})[id]();scrollTo(0,0)}
function lockLand(){try{const o=screen.orientation;if(!o||!o.lock)return;const go=()=>o.lock("landscape").catch(()=>{});if(document.fullscreenElement)go();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().then(go).catch(()=>{});else go()}catch(e){}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b){if(b.dataset.go==="game")lockLand();show(b.dataset.go)}});

function badge(){return S.medals.map(v=>ghost(med(v.split(":")[1]))).join("")}
function rMenu(){$("mname").textContent=(S.name||"Cat")+" · Season "+S.season;$("mpts").textContent=fmt(S.pts);$("mmedal").innerHTML=badge();applySkin();}
function rMedals(){$("sno").textContent=S.season+"/"+SEASONS;$("tpts").textContent=fmt(S.pts);
 $("mlist").innerHTML=medalsFor(S.season).map(m=>{const ok=S.pts>=m.need;return `<div class="card med"><div class="gw">${ghost(m,!ok)}</div><div class="mi"><b>${m.name}</b><div class="mu">${fmt(m.need)} boykisser coins</div><div class="bar"><i style="width:${Math.min(100,S.pts/m.need*100)}%"></i></div><div class="mu">${ok?"Unlocked":fmt(S.pts)+" / "+fmt(m.need)}</div></div></div>`}).join("")}
function rProfile(){$("nm").value=S.name;$("sp").textContent=fmt(S.pts);$("sw").textContent=S.wins;$("sb").textContent=S.best||"—";
 $("pbadge").innerHTML=badge();applySkin();rAdmin();
 $("picks").innerHTML=medalsFor(S.season).map(m=>{const ok=S.pts>=m.need,v=S.season+":"+m.id;return `<button class="pick${S.medals.includes(v)?" sel":""}" data-m="${v}" ${ok?"":"disabled"}>${ghost(m)}${ok?m.name:fmt(m.need)}</button>`}).join("");
 let n=0;$("coll").innerHTML=Array.from({length:S.season},(_,i)=>S.season-i).map(s=>{const e=earnedIn(s);n+=e.length;return `<div class="srow"><b>Season ${s}</b><div class="picks">${e.length?e.map(id=>{const v=s+":"+id;return `<button class="pick${S.medals.includes(v)?" sel":""}" data-m="${v}">${ghost(med(id))}${med(id).name}</button>`}).join(""):'<span class="mu">No medals yet</span>'}</div></div>`}).join("");
 $("car").innerHTML=`<div><b>${fmt(S.total)}</b><span>total coins</span></div><div><b>${S.season}/${SEASONS}</b><span>season</span></div><div><b>${n}</b><span>medals</span></div>`;
 $("ns").innerHTML=seasonDone()?(S.season>=SEASONS?'<div class="mu">All 12 seasons complete!</div>':`<button class="btn" id="newS">${arm?"Tap again to confirm":"Start season "+(S.season+1)}</button><div class="mu">Coins reset to 0. Your medals stay in the collection.</div>`):`<div class="mu">Earn all ${medalsFor(S.season).length} medals to unlock the next season.</div>`}
$("picks").addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(b&&!b.disabled)togM(b.dataset.m)});
$("coll").addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(b)togM(b.dataset.m)});
$("ns").addEventListener("click",e=>{if(!e.target.closest("#newS"))return;if(!arm){arm=true;rProfile();return}arm=false;S.hist[S.season]=earnedIn(S.season);S.season++;S.pts=0;save();rProfile();rMenu()});
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t===b));$("tabp").style.display=b.dataset.tab==="p"?"":"none";$("tabm").style.display=b.dataset.tab==="m"?"":"none";$("taba").style.display=b.dataset.tab==="a"?"":"none"});
function togM(v){const i=S.medals.indexOf(v);if(i>=0)S.medals.splice(i,1);else{S.medals.push(v);if(S.medals.length>3)S.medals.shift()}save();rProfile()}
$("nomed").onclick=()=>{S.medals=[];save();rProfile()};
$("nm").oninput=e=>{S.name=e.target.value.slice(0,16);save()};
const SK={},SKURL={},curSkin=()=>(adminOK()&&S.skin&&SK[S.skin])||catImg;
const hs=(h,s,l)=>{const f=n=>{const k=(n+h/30)%12,a=s*Math.min(l,1-l);return 255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))};return[f(0),f(8),f(4)]},lerp=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
function buildSkins(){try{const w=catImg.naturalWidth,h=catImg.naturalHeight;
 [["gold",v=>lerp([255,240,150],[232,160,10],v)],["ruby",v=>lerp([255,120,140],[185,10,45],v)],["rainbow",(v,u)=>hs((u*300+v*90)%360,.9,.62)]].forEach(([k,fn])=>{
  const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(catImg,0,0);const d=x.getImageData(0,0,w,h),p=d.data;
  for(let i=0;i<p.length;i+=4){if(p[i+3]<20)continue;const r=p[i],g=p[i+1],b=p[i+2];if(Math.abs(r-g)>30||Math.abs(g-b)>30)continue;
   const t=(r+g+b)/765,j=i/4,col=fn(((j/w)|0)/h,(j%w)/w);p[i]=col[0]*t;p[i+1]=col[1]*t;p[i+2]=col[2]*t}
  x.putImageData(d,0,0);SK[k]=c;SKURL[k]=c.toDataURL()})}catch(e){}
 applySkin();rAdmin()}
function applySkin(){const u=(adminOK()&&S.skin&&SKURL[S.skin])||CAT;document.querySelectorAll("img.cat").forEach(i=>i.src=u)}
function rAdmin(){const el=$("taba");
 if(!adminOK()){el.innerHTML=`<div class="card"><b>Admin</b><div class="mu" style="margin-top:6px">Complete 6 seasons to unlock skins and coin controls. Done: ${doneCount()}/6</div></div>`;return}
 const can=S.season>=11,mn=can?Math.min(1500,Math.max(350,S.minR)):350,sk=[["","Default"],["gold","Gold"],["rainbow","Rainbow"],["ruby","Ruby"]];
 el.innerHTML=`<div class="card"><b>Cat skins</b><div class="picks" style="margin-top:10px">${sk.map(([k,n])=>`<button class="pick${(S.skin||"")===k?" sel":""}" data-sk="${k}"><img src="${(k&&SKURL[k])||CAT}" alt="">${n}</button>`).join("")}</div></div><div class="card"><b>Minimum coins per win</b><div class="mu" style="margin:6px 0 10px">${can?"Choose a minimum up to 1500.":"Unlocks in season 11."}</div><input type="range" id="minr" min="350" max="1500" step="50" value="${mn}" ${can?"":"disabled"} aria-label="Minimum coins per win"><div class="num" id="minv" style="font-size:22px;margin-top:6px;text-align:center">${mn}</div></div>`}
$("taba").addEventListener("click",e=>{const b=e.target.closest("[data-sk]");if(b){S.skin=b.dataset.sk;save();applySkin();rAdmin()}});
$("taba").addEventListener("input",e=>{if(e.target.id==="minr"){S.minR=+e.target.value;$("minv").textContent=S.minR;save()}});

/* ---- game ---- */
const N=11,PAD=4,cv=$("cv"),cx=cv.getContext("2d"),dpr=window.devicePixelRatio||1,catImg=new Image();catImg.src=CAT;
let M,pts,px,py,rx,ry,got,done,cs=30,q=[],buf=null,lt=0,COV=null;
const DIR={u:[0,-1,1],r:[1,0,2],d:[0,1,4],l:[-1,0,8]};
function fit(){const s=Math.max(180,Math.min(innerHeight-44,innerWidth-270,520));cs=Math.floor(s/N);const w=cs*N+PAD*2;
 cv.style.width=w+"px";cv.style.height=w+"px";cv.width=w*dpr;cv.height=w*dpr;cx.setTransform(dpr,0,0,dpr,PAD*dpr,PAD*dpr)}
function gen(){for(let t=0;t<400;t++){genMaze();if(placeStart(t<250?40:25))return}}
function genMaze(){
 M=Array.from({length:N},()=>Array(N).fill(15));const seen=Array.from({length:N},()=>Array(N).fill(0));
 const D=[[0,-1,1,4],[1,0,2,8],[0,1,4,1],[-1,0,8,2]],st=[[0,0]];seen[0][0]=1;
 while(st.length){const [x,y]=st[st.length-1];
  const o=D.filter(d=>{const a=x+d[0],b=y+d[1];return a>=0&&b>=0&&a<N&&b<N&&!seen[b][a]});
  if(!o.length){st.pop();continue}
  const d=o[Math.random()*o.length|0],a=x+d[0],b=y+d[1];M[y][x]&=~d[2];M[b][a]&=~d[3];seen[b][a]=1;st.push([a,b])}
 for(let k=0;k<30;k++){const x=Math.random()*(N-1)|0,y=Math.random()*(N-1)|0;
  if(Math.random()<.5){M[y][x]&=~2;M[y][x+1]&=~8}else{M[y][x]&=~4;M[y+1][x]&=~1}}
 }
function slide(x,y,k){const [dx,dy,bit]=DIR[k],p=[];while(!(M[y][x]&bit)){x+=dx;y+=dy;p.push(y*N+x)}return p}
function placeStart(mn){const T=N*N,nx=[];
 for(let i=0;i<T;i++)nx.push("urdl".split("").map(k=>{const p=slide(i%N,i/N|0,k);return p.length?{to:p[p.length-1],p}:null}));
 const R=[];for(let s=0;s<T;s++){const seen=new Uint8Array(T),st=[s];seen[s]=1;while(st.length){const c=st.pop();for(const e of nx[c])if(e&&!seen[e.to]){seen[e.to]=1;st.push(e.to)}}R.push(seen)}
 let best=null,bn=0;
 for(let s=0;s<T;s++){let ok=true;const cov=new Uint8Array(T);
  for(let c=0;c<T;c++)if(R[s][c]){if(!R[c][s]){ok=false;break}cov[c]=1;for(const e of nx[c])if(e)for(const z of e.p)cov[z]=1}
  if(!ok)continue;cov[s]=0;let n=0;for(let c=0;c<T;c++)n+=cov[c];
  if(n>=mn&&(n>bn||(n===bn&&Math.random()<.3))){bn=n;best={s,cov}}}
 if(!best)return false;
 const c=[];for(let i=0;i<T;i++)if(best.cov[i])c.push((i%N)+","+(i/N|0));
 for(let i=c.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[c[i],c[j]]=[c[j],c[i]]}
 pts=new Set(c.slice(0,25));px=rx=best.s%N;py=ry=best.s/N|0;COV=best.cov;COV[best.s]=1;q=[];buf=null;got=0;done=false;$("got").textContent=0;return true}
function startGame(){$("gmedal").innerHTML=badge();fit();gen()}
function move(k){if(done||innerHeight>innerWidth)return;if(q.length){buf=k;return}
 const [dx,dy,bit]=DIR[k];let x=px,y=py;while(!(M[y][x]&bit)){x+=dx;y+=dy;q.push([x,y])}px=x;py=y}
function win_check(){}
function win(){done=true;const before=earnedIn(S.season).length,r=rollR();
 S.pts+=r;S.total+=r;S.wins++;S.best=Math.max(S.best,r);save();
 const nw=medalsFor(S.season).filter(m=>S.pts>=m.need).slice(before);
 $("rew").textContent="+"+r;$("wtot").textContent="Total: "+fmt(S.pts);
 $("wnew").textContent=nw.length?"New medal: "+nw.map(m=>m.name).join(", ")+"! Pick it in your profile."+(seasonDone()&&S.season<SEASONS?" Season complete! Start the next one in Profile > Medals.":""):"";
 setTimeout(()=>$("win").classList.add("on"),350)}
$("again").onclick=()=>{$("win").classList.remove("on");gen()};
addEventListener("resize",()=>{if($("game").classList.contains("on"))fit()});
addEventListener("keydown",e=>{if(!$("game").classList.contains("on"))return;
 const k={ArrowUp:"u",ArrowDown:"d",ArrowLeft:"l",ArrowRight:"r",w:"u",s:"d",a:"l",d:"r",W:"u",S:"d",A:"l",D:"r"}[e.key];if(k){e.preventDefault();move(k)}});
let hold;const stop=()=>clearInterval(hold);
$("pad").addEventListener("pointerdown",e=>{const b=e.target.closest("[data-d]");if(!b)return;e.preventDefault();move(b.dataset.d);stop();hold=setInterval(()=>move(b.dataset.d),150)});
addEventListener("pointerup",stop);addEventListener("pointercancel",stop);
let t0;cv.addEventListener("touchstart",e=>{t0=e.touches[0]},{passive:true});
cv.addEventListener("touchmove",e=>{if(!t0)return;const t=e.touches[0],dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;t0=null;move(Math.abs(dx)>Math.abs(dy)?(dx>0?"r":"l"):(dy>0?"d":"u"))},{passive:true});
cv.addEventListener("touchend",e=>{if(!t0)return;const t=e.changedTouches[0],dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY;t0=null;
 if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?"r":"l"):(dy>0?"d":"u"))});

function heart(X,Y,r){cx.beginPath();cx.moveTo(X,Y+r*.9);cx.bezierCurveTo(X-r*1.7,Y-r*.2,X-r*.8,Y-r*1.3,X,Y-r*.4);cx.bezierCurveTo(X+r*.8,Y-r*1.3,X+r*1.7,Y-r*.2,X,Y+r*.9);cx.closePath()}
function draw(t){requestAnimationFrame(draw);if(!$("game").classList.contains("on")||!M)return;
 const w=cs*N;cx.fillStyle="#fff2f8";cx.fillRect(-PAD,-PAD,w+PAD*2,w+PAD*2);if(COV){cx.fillStyle="#ecdcea";for(let i=0;i<N*N;i++)if(!COV[i])cx.fillRect((i%N)*cs,(i/N|0)*cs,cs,cs)}
 pts.forEach(k=>{const [x,y]=k.split(",").map(Number),r=cs*.2*(1+.1*Math.sin(t/220+x+y));
  heart((x+.5)*cs,(y+.5)*cs,r);cx.fillStyle="#ff4fa3";cx.fill();cx.lineWidth=1.5;cx.strokeStyle="#c21f72";cx.stroke()});
 cx.strokeStyle="#3a2350";cx.lineWidth=Math.max(3,cs*.1);cx.lineCap="round";cx.beginPath();
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){const c=M[y][x],X=x*cs,Y=y*cs;
  if(c&1){cx.moveTo(X,Y);cx.lineTo(X+cs,Y)}if(c&2){cx.moveTo(X+cs,Y);cx.lineTo(X+cs,Y+cs)}
  if(c&4){cx.moveTo(X,Y+cs);cx.lineTo(X+cs,Y+cs)}if(c&8){cx.moveTo(X,Y);cx.lineTo(X,Y+cs)}}
 cx.stroke();
 {const dt=Math.min(.05,(t-lt)/1000);lt=t;
  if(q.length){const [tx,ty]=q[0],st=Math.min(.7,18*dt),ex=tx-rx,ey=ty-ry,d=Math.hypot(ex,ey);
   if(d<=st){rx=tx;ry=ty;q.shift();if(pts.delete(tx+","+ty)){got++;$("got").textContent=got;if(got===25)win()}}else{rx+=ex/d*st;ry+=ey/d*st}}
  else if(buf){const b=buf;buf=null;move(b)}}
 if(catImg.naturalWidth){const im=curSkin(),W=im.naturalWidth||im.width,H=im.naturalHeight||im.height,k=Math.min(cs*.9/W,cs*.9/H),iw=W*k,ih=H*k;
  cx.drawImage(im,(rx+.5)*cs-iw/2,(ry+.5)*cs-ih/2,iw,ih)}}
requestAnimationFrame(draw);
catImg.complete&&catImg.naturalWidth?buildSkins():catImg.addEventListener("load",buildSkins);
rMenu();
</script></body></html>
